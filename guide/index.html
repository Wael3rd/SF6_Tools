<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <title>SF6 Native Menus Guide</title>
  <meta name="description" content="How to build fully native in-game settings windows, pause-menu rows/tabs, HUD panels, and popups in Street Fighter 6 with REFramework Lua -- no ImGui, no D2D, no DLL patching.">

  <meta property="og:title" content="SF6 Native Menus Guide">
  <meta property="og:type" content="website">
  <meta property="og:description" content="How to build fully native in-game settings windows, pause-menu rows/tabs, HUD panels, and popups in Street Fighter 6 with REFramework Lua -- no ImGui, no D2D, no DLL patching.">
  <meta property="og:url" content="https://wael3rd.github.io/SF6_Tools/guide/">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a1a2e'/%3E%3Ctext x='32' y='31' font-family='Arial, Helvetica, sans-serif' font-size='19' font-weight='700' fill='%23ffcc00' text-anchor='middle'%3ESF%3C/text%3E%3Ctext x='32' y='51' font-family='Arial, Helvetica, sans-serif' font-size='22' font-weight='700' fill='%23ff4d4d' text-anchor='middle'%3E6%3C/text%3E%3C/svg%3E">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <!-- docsify-copy-code has no separate stylesheet: it injects its own CSS at runtime -->
  <style>
    :root {
      --theme-color: #e0334f;
    }
    .app-name-link img { display: none; }
    .sidebar-nav li > p { font-weight: 600; }
    body.ready .app-nav.no-badge { padding-right: 0; }
    .markdown-section pre { border-radius: 6px; }
    .cover-main img { margin: 0; }
  </style>
</head>
<body>
  <div id="app">Loading SF6 Native Menus Guide...</div>
  <script>
    // relativePath:true -- required so language-folder copies (fr/, zh-cn/,
    // ja/) resolve their own README.md / _sidebar.md relative to their own
    // folder instead of the site root. See site/sync.py header comment
    // ("Image path strategy") for exactly how image links depend on this.
    window.$docsify = {
      name: 'SF6 Native Menus Guide',
      repo: 'https://github.com/Wael3rd/SF6_Tools',
      loadSidebar: true,
      loadNavbar: true,
      relativePath: true,
      subMaxLevel: 3,
      auto2top: true,
      maxLevel: 3,
      alias: {
        // Multi-language fallback pattern recommended by the Docsify docs:
        // language-prefixed routes resolve within their own folder first,
        // with a root catch-all so nothing 404s while translations land.
        '/fr/(.*)': '/fr/$1',
        '/zh-cn/(.*)': '/zh-cn/$1',
        '/ja/(.*)': '/ja/$1',
        '/(.*)': '/$1'
      },
      nameLink: {
        '/fr/': '#/fr/',
        '/zh-cn/': '#/zh-cn/',
        '/ja/': '#/ja/',
        '/': '#/'
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        depth: 3,
        placeholder: {
          '/fr/': 'Rechercher',
          '/zh-cn/': '搜索',
          '/ja/': '検索',
          '/': 'Search'
        },
        noData: {
          '/fr/': 'Aucun résultat',
          '/zh-cn/': '没有结果',
          '/ja/': '結果がありません',
          '/': 'No results'
        }
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      zoomImage: {
        selector: '.markdown-section img'
      }
    };
  </script>

  <!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <!-- Syntax highlighting: Lua + Prism core (Docsify bundles a Prism core already, this adds the Lua grammar) -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-lua.min.js"></script>
</body>
</html>
