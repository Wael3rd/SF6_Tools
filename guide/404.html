<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SF6 Native Menus Guide</title>
<meta http-equiv="refresh" content="0; url=./index.html">
<script>
  // Docsify uses hash routing (#/...), so a real 404 only happens when
  // something requests a path GitHub Pages doesn't have as a file (e.g. a
  // stale bookmark). Bounce to index.html and let Docsify take over from
  // the hash, same trick used by every other SPA on GitHub Pages.
  location.replace('./index.html' + location.hash);
</script>
</head>
<body>
  <p>Redirecting to the <a href="./index.html">SF6 Native Menus Guide</a>...</p>
</body>
</html>
